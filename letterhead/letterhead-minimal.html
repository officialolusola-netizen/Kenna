<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Intellingentsia Nigeria - Letterhead (Minimal)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .letterhead {
            width: 210mm;
            height: 297mm;
            background: white;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 0;
        }

        /* Header Section - Minimal Design */
        .header {
            text-align: center;
            padding: 50px 60px 40px;
            border-bottom: 2px solid #1B5E20;
            position: relative;
        }

        .logo-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-placeholder {
            width: 150px;
            height: 150px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #1B5E20;
            position: relative;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        .company-name {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #1B5E20;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .company-tagline {
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            font-weight: 400;
            color: #2E7D32;
            font-style: italic;
            letter-spacing: 0.3px;
            margin-bottom: 12px;
        }

        .company-acronym {
            font-size: 12px;
            color: #757575;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .reference-number {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            color: #999;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }

        /* Content Area */
        .content {
            padding: 50px 60px;
            min-height: 570px;
            font-size: 11pt;
            line-height: 1.8;
            color: #333;
        }

        /* Footer Section - Minimal Design */
        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            border-top: 2px solid #1B5E20;
            background: white;
        }

        .footer-content {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 0 60px;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #1B5E20;
            font-weight: 600;
        }

        .footer-icon {
            width: 18px;
            height: 18px;
            fill: #D4AF37;
        }

        .divider {
            width: 1px;
            height: 30px;
            background: #D4AF37;
        }

        /* Accent line */
        .accent-line {
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: #D4AF37;
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .letterhead {
                box-shadow: none;
                width: 210mm;
                height: 297mm;
                margin: 0;
                page-break-after: always;
            }
        }

        @page {
            size: A4;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="letterhead">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <div class="logo-placeholder">
                    <!-- Replace with your logo: <img src="assets/new-logo.png" alt="Logo"> -->
                </div>
            </div>

            <div class="company-name">The Intellingentsia Nigeria</div>
            <div class="company-tagline">...innovate, secure, empower</div>
            <div class="company-acronym">(IESDI)</div>

            <div class="reference-number">CAC/COM/2025/17648568222414</div>
        </div>

        <!-- Content Area -->
        <div class="content">
            <!-- Your letter content goes here -->
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="accent-line"></div>
            <div class="footer-content">
                <div class="footer-item">
                    <svg class="footer-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                    </svg>
                    +234 803 332 5647
                </div>

                <div class="divider"></div>

                <div class="footer-item">
                    <svg class="footer-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    39 Yaounde Street, Abuja, Nigeria
                </div>
            </div>
        </div>
    </div>
</body>
</html>
